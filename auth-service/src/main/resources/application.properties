# =========================
# Server
# =========================
server.port=8081

# =========================
# Spring Application
# =========================
spring.application.name=auth-service

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careerpilot}
spring.datasource.username=postgres
spring.datasource.password=68739905qNiK
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.default-schema=auth
spring.flyway.schemas=auth
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =========================
# Logging
# =========================
logging.level.com.careerpilot=DEBUG