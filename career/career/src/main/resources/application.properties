# ===== Server =====
server.port=8082
spring.application.name=career-service

# ===== PostgreSQL =====
spring.datasource.url=${DBURL:jdbc:postgresql://localhost:5433/careerpilot}
spring.datasource.username=${DBUSERNAME:postgres}
spring.datasource.password=${DBPASSWORD:careerpilot}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=career
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.default-schema=career
spring.flyway.schemas=career
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== Logging =====
logging.level.com.careerpilot=DEBUG
